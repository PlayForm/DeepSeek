name: Node

concurrency:
    group: Node-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    security-events: write
    contents: write
    pull-requests: write

on:
    workflow_dispatch:
    push:
        branches: [Current]
    pull_request:
        branches: [Current]
    workflow_call:

jobs:
    Gates:
        runs-on: ubuntu-latest

        env:
            ADBLOCK: true
            ASTRO_TELEMETRY_DISABLED: 1
            AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
            AZURE_CORE_COLLECT_TELEMETRY: 0
            CHOOSENIM_NO_ANALYTICS: 1
            DIEZ_DO_NOT_TRACK: 1
            DO_NOT_TRACK: 1
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
            ET_NO_TELEMETRY: 1
            GATSBY_TELEMETRY_DISABLED: 1
            GATSBY_TELEMETRY_OPT_OUT: 1
            GATSBY_TELEMETRY_OPTOUT: 1
            GRIT_TELEMETRY_DISABLED: 1
            HASURA_GRAPHQL_ENABLE_TELEMETRY: false
            HINT_TELEMETRY: off
            HOMEBREW_NO_ANALYTICS: 1
            INFLUXD_REPORTING_DISABLED: true
            ITERATIVE_DO_NOT_TRACK: 1
            NEXT_TELEMETRY_DEBUG: 1
            NEXT_TELEMETRY_DISABLED: 1
            NG_CLI_ANALYTICS: false
            NUXT_TELEMETRY_DISABLED: 1
            PIN_DO_NOT_TRACK: 1
            POWERSHELL_TELEMETRY_OPTOUT: 1
            SAM_CLI_TELEMETRY: 0
            STNOUPGRADE: 1
            STRIPE_CLI_TELEMETRY_OPTOUT: 1
            TELEMETRY_DISABLED: 1
            TERRAFORM_TELEMETRY: 0
            VCPKG_DISABLE_METRICS: 1

        strategy:
            matrix:
                # The family floor: the smokes use import.meta.dirname
                # (Node 20.11+); the older 18/19/20 matrices predate it.
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 11.18.0
                  run_install: |
                      - recursive: true
                        args: [
                          --link-workspace-packages=true,
                          --lockfile-only,
                          --prefer-frozen-lockfile=false,
                          --shamefully-hoist=false,
                          --shared-workspace-lockfile=true,
                          --strict-peer-dependencies=false,
                          --unsafe-perm=true
                        ]

            # The root lockfile is gitignored (regenerated per install) -
            # the pnpm cache would error on the missing dependency path.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}

            - run: pnpm install
              working-directory: .

            # The prettier gate: pnpm format:check runs prettier --check
            # over the tree (the .prettierignore exclusions).
            - run: pnpm format:check
              working-directory: .

            # The build: the smoke battery loads the built Target bundles.
            - run: pnpm run build:classic && pnpm run build:effect-ts
              working-directory: .

            # The 24-smoke battery: the twelve Classic suites + the twelve
            # Effect-TS suites (the verified totals: 733 Classic / 746
            # EffectTS).
            - run: pnpm test
              working-directory: .

            # The drift-guard: the Site's content-integrity gate - the
            # rendered values vs this checkout's repo (the smoke counts, the
            # totals, the versions, the post-splice name forms, the Live.ts
            # layer, the ledger-line samples' byte-verification, and the
            # built Target's freshness). The Site is its own repository, so
            # fetch it (the root checkout carries no Site tree); the guard
            # reads this checkout's Classic/EffectTS trees and the Target
            # bundles the build step above just produced. It exits 1 on any
            # drift - failing the pipeline.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: PlayForm/Site-DeepSeek
                  path: Site

            - run: node Site/Scripts/Drift-Guard.mjs
              working-directory: .

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: Classic-Node-${{ matrix.node-version }}-Target
                  path: Classic/packages/*/Target

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: EffectTS-Node-${{ matrix.node-version }}-Target
                  path: EffectTS/packages/*/Target


