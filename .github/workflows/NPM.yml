# ============================================================
# NPM - the publish workflow. Every package in the two release
# trees publishes from THIS monorepo, in the order of the packages'
# own dependency graph. The order is DERIVED at run time by
# Maintain/Publish-Packages.mjs - never hand-listed - so a package
# added to Classic/packages or EffectTS/packages publishes with no
# workflow edit.
# The npm publish itself remains the USER'S call (their token):
# this workflow runs only via workflow_dispatch / release in CI.
# Publishing is OIDC trusted-publisher based: the job's id-token:
# write lets npm publish --provenance attest each tarball to this
# repository and workflow - no NODE_AUTH_TOKEN secret is needed in
# CI; every npm package must have its trusted publisher configured
# to github.com/PlayForm/DeepSeek + .github/workflows/NPM.yml + env
# Release. Temporary/npm-bootstrap/README.md binds them with
# `npm trust github`.
# A version already on the registry is skipped, so a re-run is safe;
# a package whose dependency failed to publish is blocked instead of
# published against a missing dependency.
# ============================================================
name: NPM

concurrency:
    group: NPM-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    security-events: write
    contents: write
    pull-requests: write

on:
    workflow_dispatch:
    release:
        types: [created]
    workflow_call:

jobs:
    Publish:
        runs-on: ubuntu-latest
        environment: Release
        env:
            ADBLOCK: true
            ASTRO_TELEMETRY_DISABLED: 1
            AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
            AZURE_CORE_COLLECT_TELEMETRY: 0
            CHOOSENIM_NO_ANALYTICS: 1
            DIEZ_DO_NOT_TRACK: 1
            DO_NOT_TRACK: 1
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
            ET_NO_TELEMETRY: 1
            GATSBY_TELEMETRY_DISABLED: 1
            GATSBY_TELEMETRY_OPT_OUT: 1
            GATSBY_TELEMETRY_OPTOUT: 1
            GRIT_TELEMETRY_DISABLED: 1
            HASURA_GRAPHQL_ENABLE_TELEMETRY: false
            HINT_TELEMETRY: off
            HOMEBREW_NO_ANALYTICS: 1
            INFLUXD_REPORTING_DISABLED: true
            ITERATIVE_DO_NOT_TRACK: 1
            NEXT_TELEMETRY_DEBUG: 1
            NEXT_TELEMETRY_DISABLED: 1
            NG_CLI_ANALYTICS: false
            NUXT_TELEMETRY_DISABLED: 1
            PIN_DO_NOT_TRACK: 1
            POWERSHELL_TELEMETRY_OPTOUT: 1
            SAM_CLI_TELEMETRY: 0
            STNOUPGRADE: 1
            STRIPE_CLI_TELEMETRY_OPTOUT: 1
            TELEMETRY_DISABLED: 1
            TERRAFORM_TELEMETRY: 0
            VCPKG_DISABLE_METRICS: 1

        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"

            - run: npm install -g npm@latest
              continue-on-error: true

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 11.18.0

            - run: pnpm install

            # The whole-build trigger: the build order is the packages'
            # own dependency graph (SPLICE-ETS.md §3.3).
            - run: pnpm run build

            # The publish: one derived pass over every workspace package.
            # The order is the packages' own dependency graph, computed by
            # Maintain/Publish-Packages.mjs; a version already on the registry
            # is skipped, so a re-run is safe.
            - run: node Maintain/Publish-Packages.mjs
