# ============================================================
# NPM - the publish workflow (ARMED, the single-repo shape per
# Documentation/Plans/SPLICE-ETS.md §5.1). All 25 packages publish
# from THIS monorepo in the L0 -> L1 -> L2 topological order:
#   L0: @playform/ets-dsh-hook (the base)
#   L1: the four foundations (the classical hook-dsh-core +
#       plugin-dsh-factory, the ets-hook-dsh-core +
#       ets-plugin-dsh-factory)
#   L2: the twenty consumers
# The npm publish itself remains the USER'S call (their token):
# this workflow runs only via workflow_dispatch / release in CI.
# Publishing is OIDC trusted-publisher based: the job's id-token: write
# lets npm publish --provenance attest each tarball to this repository
# and workflow - no NODE_AUTH_TOKEN secret is needed in CI; each of the
# 25 npm packages must have its trusted publisher configured to
# github.com/PlayForm/DeepSeek + .github/workflows/NPM.yml + env Release.
# ============================================================
name: NPM

concurrency:
    group: NPM-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    security-events: write
    contents: write
    pull-requests: write

on:
    workflow_dispatch:
    release:
        types: [created]
    workflow_call:

jobs:
    Publish:
        runs-on: ubuntu-latest
        environment: Release
        env:
            ADBLOCK: true
            ASTRO_TELEMETRY_DISABLED: 1
            AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
            AZURE_CORE_COLLECT_TELEMETRY: 0
            CHOOSENIM_NO_ANALYTICS: 1
            DIEZ_DO_NOT_TRACK: 1
            DO_NOT_TRACK: 1
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
            ET_NO_TELEMETRY: 1
            GATSBY_TELEMETRY_DISABLED: 1
            GATSBY_TELEMETRY_OPT_OUT: 1
            GATSBY_TELEMETRY_OPTOUT: 1
            GRIT_TELEMETRY_DISABLED: 1
            HASURA_GRAPHQL_ENABLE_TELEMETRY: false
            HINT_TELEMETRY: off
            HOMEBREW_NO_ANALYTICS: 1
            INFLUXD_REPORTING_DISABLED: true
            ITERATIVE_DO_NOT_TRACK: 1
            NEXT_TELEMETRY_DEBUG: 1
            NEXT_TELEMETRY_DISABLED: 1
            NG_CLI_ANALYTICS: false
            NUXT_TELEMETRY_DISABLED: 1
            PIN_DO_NOT_TRACK: 1
            POWERSHELL_TELEMETRY_OPTOUT: 1
            SAM_CLI_TELEMETRY: 0
            STNOUPGRADE: 1
            STRIPE_CLI_TELEMETRY_OPTOUT: 1
            TELEMETRY_DISABLED: 1
            TERRAFORM_TELEMETRY: 0
            VCPKG_DISABLE_METRICS: 1

        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"

            - run: npm install -g npm@latest
              continue-on-error: true

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - run: pnpm install

            # The whole-build trigger: the build order is the packages'
            # own dependency graph (SPLICE-ETS.md §3.3).
            - run: pnpm run build

            # ------------------------------------------------------------
            # L0: the base. Every ets-* package depends on it - it must
            # exist on the registry first (SPLICE-ETS.md §5.1, §9.3).
            # ------------------------------------------------------------
            - name: Publish L0 - @playform/ets-dsh-hook
              working-directory: EffectTS/packages/ets-dsh-hook
              run: npm publish --provenance --access public --ignore-scripts

            # ------------------------------------------------------------
            # L1: the four foundations (the classical pair + the ets pair;
            # the ets pair depends on the L0 base + effect).
            # ------------------------------------------------------------
            - name: Publish L1 - @playform/hook-dsh-core
              working-directory: Classic/packages/hook-dsh-core
              run: npm publish --provenance --access public --ignore-scripts

            - name: Publish L1 - @playform/plugin-dsh-factory
              working-directory: Classic/packages/plugin-dsh-factory
              run: npm publish --provenance --access public --ignore-scripts

            - name: Publish L1 - @playform/ets-hook-dsh-core
              working-directory: EffectTS/packages/ets-hook-dsh-core
              run: npm publish --provenance --access public --ignore-scripts

            - name: Publish L1 - @playform/ets-plugin-dsh-factory
              working-directory: EffectTS/packages/ets-plugin-dsh-factory
              run: npm publish --provenance --access public --ignore-scripts

            # ------------------------------------------------------------
            # L2: the twenty consumers (ten classical + ten ets; within
            # a layer the order is arbitrary - all their @playform/*
            # dependencies exist after L0 + L1).
            # ------------------------------------------------------------
            - name: Publish L2 - the classical consumers
              working-directory: Classic/packages
              run: |
                  for d in hook-dsh-cargo-governor hook-dsh-normalize-dash hook-dsh-normalize-ellipsis hook-dsh-normalize-file hook-dsh-normalize-fullwidth hook-dsh-normalize-invisible hook-dsh-normalize-quotes hook-dsh-normalize-spaces hook-dsh-package-governor hook-dsh-package-pinner; do
                      (cd "$d" && npm publish --provenance --access public --ignore-scripts)
                  done

            - name: Publish L2 - the ets consumers
              working-directory: EffectTS/packages
              run: |
                  for d in ets-hook-dsh-cargo-governor ets-hook-dsh-package-governor ets-hook-dsh-normalize-dash ets-hook-dsh-normalize-ellipsis ets-hook-dsh-normalize-file ets-hook-dsh-normalize-fullwidth ets-hook-dsh-normalize-invisible ets-hook-dsh-normalize-quotes ets-hook-dsh-normalize-spaces ets-hook-dsh-package-pinner; do
                      (cd "$d" && npm publish --provenance --access public --ignore-scripts)
                  done
