# Bundle patch for @playform/plugin-dsh-workspace-evidence.
# The evidence service owns the validation objects + the evidence deps + the
# four kinds of truth + the stale-validation invalidation, and answers
# through the workspaceEvidence service (the family map's EVIDENCE role,
# phase 4 of the invisible flow, with semantics + approve). The invalidation
# is the Acar seam: a dependency change marks the dependent validations
# stale - never guessed back to fresh (Documentation/Plans/Workspace-Family/
# EVIDENCE.md).
#
# New entries are declared with `insert:` - a bare `id:` row PATCHES an
# existing entry and the loader rejects unknown ids with
# 'entry "..." not found'. Activated when the profile's package.json lists
# the package in dsh.profile.bundles AND the app is restarted.
#
# THE IDLE-FOREVER POSTURE: this entry ships with enabled: false and NOTHING
# else - the service never appears in the profile's bundles and enables only
# by an explicit ACTIVATE. On a cold mount the State build logs
# `disabled (enabled=false)` and the service answers honestly from an empty
# store (validate still records once enabled). The schema defaults are the
# truth; the full default surface (domain workspace_evidence,
# maxValidations 512, the glob triple exclude, and the logFile default)
# lives in the Variable/Config.ts schema. EVERY knob is volatile
# (hot-editable without remounting): enabled, log/logFile, domain,
# maxValidations and exclude.
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist, the
# shared factory block, mapped to State.Allow. This package's actions are
# read-only and record, all automatic - it has NO gated action (it never
# writes a file, commits a batch or spawns an agent), so the block documents
# the posture and refuses nothing. read/index/record/suggest/message are
# automatic; write/commit/spawn stay the shipped `approve` for the family's
# write paths. A resolved pack's `policy` section overrides these defaults
# per action (the wiring is the next refinement).
- insert:
      - id: plugin-dsh-workspace-evidence
        name: "@playform/ets-plugin-dsh-workspace-evidence"
        config:
            enabled: false
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
