# Bundle patch for @playform/plugin-dsh-workspace-graph.
# The workspace graph builds the W1 graph schema v0 over the workspace files:
# four node kinds (File, Symbol, Block, Test) plus Markdown DocSections and two
# edge kinds (contains, imports), with stable ids, content-derived
# fingerprints, and the indexRevision the graph was built from. The v0 parser
# is an honest line/regex scanner (no compiler API); every deferred node/edge
# kind (ConfigKey, references, calls, tests) is NOT faked. Records live in the
# KV facet through the storage domain (one record per path plus the __meta
# revision), and the plugin writes NOTHING outside its own domain.
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE IDLE-FOREVER POSTURE: this entry ships with enabled: false and the FULL
# Config defaults as the row - the plugin never appears in the profile's
# bundles and enables only by an explicit ACTIVATE (the user edits the
# profile and restarts). With config enabled=false the mutating operations
# (indexFile, indexWorkspace) skip with the byte-exact
# `graph: skipped <path> (disabled)` ledger line while the service itself
# still registers, and NO trace adapter is wired (the graph subscribes to
# observe/stamp on the family's bus - ctx.trace, provided by the factory - and
# emits graph/indexed / graph/invalidated; see SCHEME.md section 6.1). Every
# knob is volatile; the schema defaults are the truth (Variable/Config.ts).
#
# maxFiles is the INDEXING TRIGGER's walk bound (indexWorkspace stops after
# this many candidate files; a caller's explicit maxFiles option overrides it
# for that call).
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist ships
# with its defaults - read/index/record/suggest and message are automatic,
# write/commit/spawn wait for approval. The graph's actions are INDEX
# (automatic), so this package has NO gated action: it never writes a file,
# commits a batch or spawns an agent, and no verdict can refuse it. A resolved
# pack's `policy` section overrides these defaults per action (the wiring is
# the next refinement).
- insert:
      - id: plugin-dsh-workspace-graph
        name: "@playform/ets-plugin-dsh-workspace-graph"
        config:
            enabled: false
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
            domain: workspace_graph
            languages:
                - typescript
                - javascript
                - markdown
            include: []
            exclude:
                - node_modules/**
                - "**/Target/**"
                - "**/.git/**"
            maxFileBytes: 1000000
            maxNodesPerFile: 5000
            maxFiles: 2000
            limitDefault: 50
            limitMaximum: 500
