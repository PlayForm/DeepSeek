# Bundle patch for @playform/ets-hook-dsh-normalize-file.
# The file-content normalizer flavor: the family's rewrite beyond the tool
# layer - rewriting the normalize family's characters in files ALREADY on
# disk. It registers NO event listener (the family's first listener-less
# flavor): the trigger is an explicit agent call of the `normalize-file` TOOL
# it registers, whose exec reads the target, applies the family's six
# transforms (the core's Dashes/Quotes/Ellipsis/Spaces/Invisible/Fullwidth
# tables, the same chain the raw-write `normalize: true` applies), and writes
# back ONLY when N > 0 through the factory's shared write executor
# (fs/write-intent waterfall, standing sandbox policy, writeText, the
# root-context fs/observed present emit with the call as the actor). A no-op
# (N = 0) writes NOTHING - the no-op no-write rule. The background-rewrite
# posture (an fs/observed listener sweeping every write) is deliberately NOT
# shipped: it would break the edit tool's old_string contract and interleave
# with the governance trio's bounded passes (the design report's verdict -
# revisit only with an edit-contract mechanism).
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the app
# is restarted (bundle layers compose at host boot). A file: dependency alone
# is NOT activation.
#
# `replacement` is the dash step's only knob (volatile: hot-editable); the
# log/logFile cells are volatile for the same reason. The tool's existence is
# the default-ON part of the design (it is inert until called - the per-call
# opt-in IS the design); there is no watch-arm switch because no watch arm
# exists.
- insert:
      - id: ets-hook-dsh-normalize-file
        name: "@playform/ets-hook-dsh-normalize-file"
        config:
            log: true
            logFile: ~/.dsh/ets-hook-dsh-normalize-file.log
            replacement: "-"
