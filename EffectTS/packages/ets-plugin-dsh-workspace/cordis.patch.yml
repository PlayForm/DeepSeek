# Bundle patch for @playform/plugin-dsh-workspace.
# The workspace agent is the workspace regime's conversational surface
# (WORKSPACE-AGENT.md): the operational view the conversation addresses,
# through the FIVE tools (workspace_map, workspace_find, workspace_expand,
# workspace_context, workspace_index) over the Wave-1 graph service
# (Documentation/Plans/WORKSPACE-FAMILY-V4-1.md sections 3.4-3.5).
# workspace_index is the indexing trigger: it delegates to the graph's
# indexWorkspace, so the graph is populated from the conversation.
#
# New entries are declared with `insert:` - a bare `id:` row PATCHES an
# existing entry and the loader rejects unknown ids. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted.
#
# THE IDLE-FOREVER POSTURE: this entry ships with enabled: false and NOTHING
# else - the plugin never appears in the profile's bundles and enables only
# by an explicit ACTIVATE. On a cold mount the State build logs
# `disabled (enabled=false)` and every tool no-ops to a clear refusal. The
# schema defaults are the truth; the full default surface lives in
# Variable/Config.ts. EVERY knob is volatile (hot-editable without
# remounting): enabled, log/logFile, mapDepth, mapMaxModules, findLimit,
# findLimitMax, expandDepth, expandMaxNeighbors, packetTokenBudget,
# packetTokenMax, tokenCharsPerToken and the kinds filter.
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist ships
# with its defaults - read/index/record/suggest and message are automatic,
# write/commit/spawn wait for approval. The workspace agent's actions are
# READ-ONLY (automatic), so this package has NO gated action: it never writes a
# file, commits a batch or spawns an agent, and no verdict can refuse it. A
# resolved pack's `policy` section overrides these defaults per action (the
# wiring is the next refinement).
- insert:
      - id: plugin-dsh-workspace
        name: "@playform/ets-plugin-dsh-workspace"
        config:
            enabled: false
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
