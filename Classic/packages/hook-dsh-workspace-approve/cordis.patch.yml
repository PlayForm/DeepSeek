# Bundle patch for @playform/hook-dsh-workspace-approve.
# The workspace-approve hook binds the EXACT human approval: an approval binds
# to the concrete change set (path + content fingerprint + the observed file
# version), the constraints travel with the approval, and the merge/execute
# side checks the exact fingerprint through the workspaceApprove service
# (Documentation/Plans/Workspace-Family/APPROVE.md).
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE SHIP-ENABLED POSTURE: this entry ships with enabled: true plus the
# log base (log: true and the module's ledger logFile) - installing the
# plugin yields an enabled plugin, and the profile may turn it off
# with enabled: false (then restart). On a cold mount with enabled: false
# the State build logs `disabled (enabled=false)`, and every surface is
# still registered - the fs/observed listener, the storage effect and the
# service - with each surface checking the flag at CALL time, so a disabled
# call passes through with zero ledger lines and a volatile flip acts on the
# very next call without a remount. The schema defaults are the truth; the
# full default surface
# (domain workspace_approve, maxBindings 1000, requireConstraints true)
# lives in the Variable/Config.ts schema. Every knob is volatile
# (hot-editable without remounting).
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist. The
# approve hook's actions are RECORD (it binds a candidate and decides on a
# binding) - all AUTOMATIC - so the package has NO gated action: it never
# writes a file, commits a batch or spawns an agent, and no verdict can
# refuse it. read/index/record/suggest and message are automatic;
# write/commit/spawn wait for approval for the family's write paths. A
# resolved pack's `policy` section overrides these defaults per action (the
# wiring is the next refinement).
- insert:
      - id: hook-dsh-workspace-approve
        name: "@playform/hook-dsh-workspace-approve"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/hook-dsh-workspace-approve.log
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
