# Bundle patch for @playform/hook-dsh-convention-suggester.
# The convention-suggester hook names the companion files of a change from
# the agent's OWN previous tool calls in this workspace: it folds every
# `tool/call` into the session's touch history and, on every write/edit call,
# prepends ONE labeled additionalContexts notice naming the files touched
# right after the anchor. An explicit repo/user pack is the override when the
# history is empty. The arbiter is the smoke suite that asserts the behavior
# (Documentation/Plans/SEARCH-SUGGESTER-PLUGIN.md sections 3.4, 4, 8, 9.4).
# READ-ONLY by design: the hook never edits, never rewrites arguments, and
# never denies.
#
# New entries are declared with `insert:` - a bare `id:` row PATCHES an
# existing entry and the loader rejects unknown ids with 'entry "..." not
# found'. Activated when the profile's package.json lists the package in
# dsh.profile.bundles AND the app is restarted. A file: dependency alone is
# NOT activation.
#
# SHIPS DISABLED (enabled: false): a suggester's acceptance rate must be
# measured before it is trusted (the plan's kill criterion, section 10.3);
# the Lead enables it explicitly in the wiring pass. Every knob is volatile
# (hot-editable without remounting).
- insert:
      - id: convention-suggester
        name: "@playform/hook-dsh-convention-suggester"
        config:
            enabled: false
            log: true
            logFile: ~/.dsh/playform/hook-dsh-convention-suggester.log
            threshold: 0.75
            maxCandidates: 7
            maxNoteChars: 1200
            cooldownCalls: 6
            maxNotesPerTurn: 3
            # The D4 pack learner is RETIRED: the field is kept for config
            # compatibility until the history-driven proposal lands.
            learning: false
            emitOn:
                - edit
                - raw-write
                - write
