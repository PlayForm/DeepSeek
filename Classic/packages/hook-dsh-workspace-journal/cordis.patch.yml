# Bundle patch for @playform/hook-dsh-workspace-journal.
# The journal hook records the workspace's evidence: the per-batch records,
# the revert data (the per-file pre-images), and the crash recovery
# (JOURNAL.md; WORKSPACE-FAMILY-V4-1.md sections 3.7-3.8). The batch is
# journaled BEFORE its writes land, so a crash between the commit and the
# seal is never an invisible intermediate state - the honest all-or-nothing
# is "recoverable partial states, never an invisible intermediate state".
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE SHIP-ENABLED POSTURE: this entry ships with enabled: true plus the log
# base (log: true and the module's ledger logFile) - installing the plugin
# yields an enabled plugin, and the profile may turn it off
# with enabled: false (then restart). On a cold mount with enabled: false
# the State build logs `disabled (enabled=false)` and every
# listener no-ops to a passthrough (it checks State.On first). The schema
# defaults are the truth; the full default surface (logFile
# ~/.dsh/playform/hook-dsh-workspace-journal.log, domain workspace_journal, maxBatches 200,
# maxEntryBytes 65536, the default exclusion triple) lives in
# Variable/Config.ts. EVERY knob is volatile (hot-editable without
# remounting): enabled, log/logFile, domain, maxBatches, maxEntryBytes and
# the exclusion list.
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist. The
# journal's ONE gated action is the revert - it writes the pre-images back,
# so `write: approve` refuses the pass with the documented
# `revert held <n> files (policy write=approve)` line, zero writes, no state
# change and no record (the batch stays reversible and waits for the user).
# Recording (open/seal/recover) is `record` = automatic; read/index/record/
# suggest and message are automatic; write/commit/spawn wait for approval. A
# resolved pack's `policy` section overrides these defaults per action (the
# wiring is the next refinement).
- insert:
      - id: hook-dsh-workspace-journal
        name: "@playform/hook-dsh-workspace-journal"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/hook-dsh-workspace-journal.log
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
