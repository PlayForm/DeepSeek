# Bundle patch for @playform/plugin-dsh-gitguard.
# The git guard is the tools/pre-execute DENY-LIST on the terminal/exec
# tool surface: it intercepts terminal commands before execution and denies
# ANY git mutation pattern (git add, commit, reset, push, tag, rm,
# checkout, branch, merge, stash, clean, rebase, revert, ...) while
# allowing the read-only checks (git status, log, diff, show, rev-parse,
# ls-files, fetch). Denials surface ONCE as the refusal line, never
# punish; every denied attempt is ledgered for the user's audit
# (Documentation/Plugins/ORCHESTRATION-PLUGINS.md section 3).
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE LIVE DISABLED POSTURE: the tools/pre-execute listener registers on
# EVERY mount - a disabled mount logs the byte-exact `disabled (enabled=false)`
# line instead of the activation proof, and the guard reads the volatile On
# cell at CALL time, so a disabled guard passes every dispatch through with
# zero ledger lines (a flip lands on the next dispatch, with no remount). The
# schema defaults are the
# truth: enabled true, log true, the full default deny list (the 23 mutation
# subcommands), the
# allow list (the read-only checks + fetch), strict false (deny-list mode),
# exclude empty. EVERY knob is volatile (hot-editable without remounting).
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist. The
# guard is READ-ONLY (it classifies and ledgers, never writes, commits or
# spawns), so its own action classes are read/record (automatic); the
# write/commit/spawn verdicts are declared for family uniformity and stay the
# shipped approve. A resolved pack's `policy` section overrides these defaults
# per action (the wiring is the next refinement).
- insert:
      - id: plugin-dsh-gitguard
        name: "@playform/plugin-dsh-gitguard"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/plugin-dsh-gitguard.log
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
