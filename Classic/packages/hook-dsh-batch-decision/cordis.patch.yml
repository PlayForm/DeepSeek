# Bundle patch for @playform/hook-dsh-batch-decision.
# The batch-decision hook: the thin workflow owner between the suggester,
# the pass-on, the ingester and the live view (Documentation/Plans/
# PASS-ON-AND-INGESTER.md section 5). It listens for batch/proposed, runs
# the decision gate (expiry first, then the conservative auto-approve
# policy: the first batch of an intent class always requires the user),
# records the BatchDecision, emits batch/decision, and exposes the
# batch_decision tool as the user's one entry point. It never writes files:
# the ingester stays the only writer.
#
# New entries are declared with `insert:` (a bare `id:` row PATCHES an
# existing entry). Activated when the profile's package.json lists the
# package in dsh.profile.bundles AND the app is restarted; a file:
# dependency alone is NOT activation.
#
# THE LIVE DISABLED POSTURE: every listener, the batch_decision tool and
# every effect register on every mount - a disabled mount writes only the
# byte-exact `disabled (enabled=false)` ledger line instead of the activation
# proof, and every surface reads the volatile On cell at CALL time (a flip
# lands on the very next call, with no remount). The SECOND explicit flip is
# autoApprove: "off" by default - the write path is never auto-approved by
# default (the conservative policy). Every knob is volatile (hot-editable
# without remounting): enabled, log/logFile, autoApprove, allowlist,
# maxAutoTargets, minConfidence, pendingTtlMs.
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist is the
# OUTER gate in front of autoApprove - `commit: approve` holds the policy
# auto-approval even with the knob on (the documented
# `decision held <id> (policy commit=approve)` line: the proposal stays
# pending for the user's batch_decision approval). read/index/record/suggest
# and message are automatic; write/commit/spawn wait for approval. A resolved
# pack's `policy` section overrides these defaults per action (the wiring is
# the next refinement).
- insert:
      - id: hook-dsh-batch-decision
        name: "@playform/hook-dsh-batch-decision"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/hook-dsh-batch-decision.log
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
