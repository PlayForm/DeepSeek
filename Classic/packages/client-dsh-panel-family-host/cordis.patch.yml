# Bundle patch for @playform/client-dsh-panel-family-host.
#
# The host half of the UI family's panel: the family-host endpoint giving the
# central panel LIVE data - tail(namespace, lines) for the family ledger
# tails and stats() for the ccr store summary (Documentation/Plans/UI-Family/
# PHASE-5-ADAPTERS-AND-LEDGER-TAILS.md). READ-ONLY: the endpoint reads
# ~/.dsh family logs ONLY, no write surface (A5.3). fiberPhases come from the
# existing remote.pluginManager - no new endpoint for them.
#
# New entries are declared with `insert:`; activated when the profile's
# package.json lists the package in dsh.profile.bundles AND the app restarts.
# The PoC ships the row DISABLED (the PoC brief's mandatory anatomy:
# `enabled: false`); the end-phase wiring pass decides the final posture.
- insert:
      - id: client-dsh-panel-family-host
        name: "@playform/client-dsh-panel-family-host"
        config:
            enabled: false
            logRoot: ~/.dsh
            maxLines: 200
            ccrLog: ~/.dsh/ccr.log
