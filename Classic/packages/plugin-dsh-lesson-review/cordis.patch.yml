# Bundle patch for @playform/plugin-dsh-lesson-review.
# The lesson-review service: it owns the usage store, the pending queue, the
# review prompt, the judge, the guarded corpus write and the staleness/archive
# pass behind the self-improvement loop (Documentation/Plans/
# LESSON-REVIEW-PLUGIN.md). The trigger is the sibling
# `@playform/hook-dsh-lesson-nudge`; consumers resolve `ctx.lesson`.
#
# New entries are declared with `insert:` (a bare `id:` row PATCHES an existing
# entry). Activated when the profile's package.json lists the package in
# dsh.profile.bundles AND the app is restarted; a file: dependency alone is NOT
# activation.
#
# THE LIVE DISABLED POSTURE: the service registers on every mount - the
# store load, the manual lifecycle seams and the review pipeline all come up.
# A disabled mount (`enabled: false`) logs the byte-exact
# `disabled (enabled=false)` line instead of the activation proof, and the
# review pipeline reads the volatile cell at CALL time (Tick never comes due
# with zero ledger lines, Curate returns the empty curation, Review answers
# `unavailable`), so the nudge hook never hard-fails on a missing service.
# The base trio is enabled: true, log: true, logFile
# ~/.dsh/playform/plugin-dsh-lesson-review.log.
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist, the
# shared factory block. The service READS the corpus, RECORDS usage and SUGGESTS
# lessons (read/index/record/suggest automatic) and never commits or spawns -
# those verdicts are declared for family uniformity and stay the shipped
# `approve`. `write: approve` is the one that matters: an accepted operation is
# QUEUED (`~/.dsh/lesson/pending.jsonl`) until it is accepted, so the shipped
# posture PROPOSES and never publishes.
- insert:
      - id: plugin-dsh-lesson-review
        name: "@playform/plugin-dsh-lesson-review"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/plugin-dsh-lesson-review.log
            intervalTurns: 10
            staleAfterDays: 14
            archiveAfterDays: 30
            consolidate: false
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
