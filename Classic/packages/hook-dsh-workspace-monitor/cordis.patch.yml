# Bundle patch for @playform/hook-dsh-workspace-monitor.
# The workspace-monitor hook plays the workspace family's watch/sweep role:
# the wave-3 machinery with NO REAL TIMERS. The watch form records one entry
# per fs/observed event (heard on the ROOT context, the factory's Wire
# registration) with a debounce deadline from the module's Clock; the sweep
# form is a CLOCK-BASED SCHEDULE - a deadline scan that runs inside the
# event-driven checkpoints and re-arms each entry from the Clock (never a
# setTimeout or setInterval). The shipped check-set catalog (tsc, format,
# cargo, governance) classifies watched paths and is recorded for the
# accountability trail; the monitor never executes a command
# (Documentation/Plans/Workspace-Family/MONITOR.md).
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE SHIP-ENABLED POSTURE: this entry ships with enabled: true plus the log
# base (log: true and the module's ledger logFile) - installing the plugin
# yields an enabled plugin, and the profile may turn it off
# with enabled: false (then restart). On a cold mount with enabled: false
# the State build logs `disabled (enabled=false)` and no listener
# is wired. The schema defaults are the truth; the full default surface
# (domain workspace_monitor, debounceMs 250, sweepIntervalMs 600000,
# maxWatch 500, include empty, the glob exclude triple, and the four-entry
# check-set catalog) lives in the Variable/Config.ts schema. EVERY knob is
# volatile (hot-editable without remounting): enabled, log/logFile, domain,
# debounceMs, sweepIntervalMs, maxWatch, include, exclude and checksets.
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist. The
# monitor hook's actions are RECORD (every watch entry and every sweep
# decision is recorded) - all AUTOMATIC - so the package has NO gated action:
# it never writes a file, commits a batch or spawns an agent, and no verdict
# can refuse it. read/index/record/suggest and message are automatic;
# write/commit/spawn wait for approval for the family's write paths. A
# resolved pack's `policy` section overrides these defaults per action (the
# wiring is the next refinement).
- insert:
      - id: hook-dsh-workspace-monitor
        name: "@playform/hook-dsh-workspace-monitor"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/hook-dsh-workspace-monitor.log
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
