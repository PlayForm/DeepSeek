# The cordis bundle patch: one row, the Cost tab plugin. The tab mounts into
# the conversation.view slot (the same slot the family panel already owns), so
# the row carries only the plugin identity and its volatile knobs; the loader
# validates the schema at boot and refuses the row on a mismatch.
- insert:
      - id: client-dsh-panel-cost
        name: "@playform/client-dsh-panel-cost"
        config:
            enabled: true
            tabOrder: 30
            rows: 200
            locale: en
