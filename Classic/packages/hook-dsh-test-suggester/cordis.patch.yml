# Bundle patch for @playform/hook-dsh-test-suggester.
# The test-suggester hook answers the TEST task intent with a target set
# drawn from the agent's OWN previous tool calls: the history is a host-only
# `ctx.sessionProjections` unit that folds committed `tool/call` events (one
# touch per call, capped at 512; registered optionally through
# `ctx.inject(["sessionProjections"], ...)`, read through
# `stateOf(session, key)`), and on a judged call the files touched
# right after this one in this workspace become ONE synthetic `History`
# family that the deterministic classifier, the existence filter, the gate
# and the note judge exactly like a pack row. The note is ONE labeled
# additionalContexts notice; it never replaces content (Documentation/Plans/
# SEARCH-SUGGESTER-PLUGIN.md sections 3, 4, 8).
#
# THE PACK IS AN EXPLICIT OVERRIDE ONLY: `<repo>/.dsh/pack.yml` or the user
# layer, resolved with `builtin: false`, so the literal built-in pack is never
# a candidate source. A workspace with no history and no pack abstains with
# the byte-exact line `abstained no-history  0.00`; a call outside any
# workspace (no `.git`/`package.json` root) abstains `abstained
# foreign-workspace  0.00`.
#
# THE RECONCILIATION (the completion spec's wave 2c re-spec) rides the same
# post-execute listener: on a judged call in a package it compares the package's smoke
# claims (the folder READMEs' `## Expected count`) with the tree (the
# folders, the suite files, the aggregate runner's roster) and, when the
# workspace graph is present, its Test nodes - READ-ONLY, one note, gated by
# the same enabled/cooldown/dedupe/cap knobs. It adds no config field.
#
# New entries are declared with `insert:` - a bare `id:` row PATCHES an
# existing entry and the loader rejects unknown ids with 'entry "..." not
# found'. Activated when the profile's package.json lists the package in
# dsh.profile.bundles AND the app is restarted. A file: dependency alone is
# NOT activation.
#
# SHIPS DISABLED (enabled: false): a suggester's acceptance rate must be
# measured before it is trusted (the plan's kill criterion, section 10.3);
# the Lead enables it explicitly in the wiring pass. Every knob is volatile
# (hot-editable without remounting): enabled, log/logFile, threshold,
# maxCandidates, maxNoteChars, cooldownCalls, maxNotesPerTurn, intents,
# emitOn, exclude.
- insert:
      - id: test-suggester
        name: "@playform/hook-dsh-test-suggester"
        config:
            enabled: false
            log: true
            logFile: ~/.dsh/playform/hook-dsh-test-suggester.log
            threshold: 0.75
            maxCandidates: 7
            maxNoteChars: 1200
            cooldownCalls: 6
            maxNotesPerTurn: 3
            emitOn:
                - bash
                - glob
                - grep
                - read
