# Bundle patch for @playform/hook-dsh-normalize-quotes.
# The quotes hook NORMALIZES MODEL OUTPUT: it registers one llm/stream
# waterfall listener — the interceptable wrapper around every streaming model
# call (retry, replay, routing) — and maps the curly quote family to its
# ASCII straight counterparts in text/reasoning deltas and in the assembled
# block-end blocks. The typographic quotes arrive from smart-quote processors
# and code editors; the straight forms are the unambiguous literals every
# parser, shell and diff understands — the eight typographic code points
# (single U+2018–U+201B, double U+201C–U+201F, including the low-9 and
# high-reversed-9 variants) each map to exactly one ASCII counterpart. Unlike
# the governance family (fs/observed, silent), the rewrite is deliberately
# VISIBLE — it flows into both the live UI and the durable transcript, because
# the normalization IS the feature.
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) — a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "…" not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the app
# is restarted (bundle layers compose at host boot). A file: dependency alone
# is NOT activation.
#
# NO `replacement` FIELD: this is a MAP flavor — the substitution is the
# core's Quotes table (one character in, its straight counterpart out), which
# carries no configured knob, so the config carries none either. The
# log/logFile cells are volatile (hot-editable). `normalizeReasoning` defaults
# to ON (the deltas AND the assembled block must agree);
# `normalizeToolArguments` is IMPLEMENTED (the argumentsDelta text and the
# assembled ToolCallBlock arguments are rewritten by the same map when on,
# with two exemptions: an `edit` call passes through by identity (old_string
# must match real file bytes) and a call whose arguments open with the
# `{"__normalize":false` first-key marker passes through unnormalized with
# the marker entry stripped)
# with the SCHEMA default OFF — tool-call arguments are execution-critical
# raw JSON — and this example patch turns it ON (opt-in: the user accepts
# the risk).
- insert:
      - id: hook-dsh-normalize-quotes
        name: "@playform/hook-dsh-normalize-quotes"
        config:
            log: true
            logFile: ~/.dsh/hook-dsh-normalize-quotes.log
            normalizeReasoning: true
            normalizeToolArguments: true
