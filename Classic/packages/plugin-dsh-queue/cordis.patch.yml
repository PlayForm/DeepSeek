# Bundle patch for @playform/plugin-dsh-queue.
# The SUBAGENT QUEUE turns subagent work into a queue (the tasks as data, not
# the agents as contexts): the main conversation holds up to 10 reserved
# slots, every spawned agent's own child fan-out is capped at 2 (the
# two-active regime), the dispatcher assigns the queued tasks in a
# deterministic order (dependencies, then priority, then FIFO) when a slot
# frees, and each dispatch carries its route resolved through the routing
# enforcer when that plugin is present (Documentation/Plans/
# SUBAGENT-QUEUE-PLUGIN.md sections 1-2).
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE IDLE-FOREVER POSTURE: this entry ships with enabled: false and NOTHING
# else - the plugin never appears in the profile's bundles and enables only
# by an explicit ACTIVATE (the user edits the profile and restarts). On a
# cold mount the State build logs `disabled (enabled=false)` and the tools
# and the service no-op. The schema defaults are the truth: the user's
# capacity model (main 10, child 2), auto-dispatch on a freed slot, routed
# dispatch when the routing enforcer is present, and the SPAWN OFF
# (`autoSpawn: false` - the approval posture: a spawn is a privileged action,
# so the queue assigns seats and ledgers until the user turns the launch on;
# the backend it would select is `spawnProvider: "spawn"`, the harness's
# in-process subagent backend). EVERY knob is volatile (hot-editable without
# remounting): enabled, log/logFile, the capacity object, autoDispatch,
# routedDispatch, autoSpawn and spawnProvider.
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist is the
# OUTER gate in front of autoSpawn - `spawn: approve` holds the launch even
# with the knob on (the documented `spawn held <id> (policy spawn=approve)`
# line, the task waiting with its seat held). read/index/record/suggest and
# message are automatic; write/commit/spawn wait for approval. A resolved
# pack's `policy` section overrides these defaults per action (the wiring is
# the next refinement).
- insert:
      - id: plugin-dsh-queue
        name: "@playform/plugin-dsh-queue"
        config:
            enabled: false
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
