# Bundle patch for @playform/plugin-dsh-batchstate.
# The batch-state plugin is the cooperative batch's live state board: it
# owns the open-batch state (the members: id, role, the CURRENT ACTIVITY
# task, the status, the queue position, the owned surfaces, the
# timestamps), the write API (setTask/setStatus/setScope/queue), the read
# API (the batchstate service: getState/getContext/getScope/whoElse), the
# compiled presentation (the dynamic table-of-contents block, recompiled
# on every state change - Context = Compile(State)) and the ledger. Every
# state change emits the batch/state-change event and persists the
# snapshot into the well-known JSON state file (Documentation/Plans/
# BATCH-STATE-PLUGIN.md sections 2 and 7).
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE LIVE DISABLED POSTURE: the service, the store probe (the storage
# domain effect or the JSON fallback recovery) and the inbox splice listeners
# register on EVERY mount - a disabled mount writes only the byte-exact
# `disabled (enabled=false)` ledger line instead of the activation proof, and
# every surface reads the volatile On cell at CALL time, so a disabled write
# or splice passes through with zero ledger lines. The schema defaults are
# the truth; the full default surface (enabled true, log true, batch default,
# stateFile ~/.dsh/batch-state.json, maxRecent 8) lives in the
# Variable/Config.ts schema. EVERY knob is volatile (hot-editable without
# remounting).
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist, the
# shared factory block. The board is a RECORDER/projection - read/record/
# suggest are automatic; the write/commit/spawn verdicts are declared for
# family uniformity and stay the shipped approve (the board never writes
# files, commits or spawns). A resolved pack's `policy` section overrides
# these defaults per action (the wiring is the next refinement).
- insert:
      - id: plugin-dsh-batchstate
        name: "@playform/plugin-dsh-batchstate"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/plugin-dsh-batchstate.log
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
