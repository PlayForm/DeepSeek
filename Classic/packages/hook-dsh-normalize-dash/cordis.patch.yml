# Bundle patch for @playform/hook-dsh-normalize-dash.
# The dash hook NORMALIZES MODEL OUTPUT: it registers one llm/stream
# waterfall listener — the interceptable wrapper around every streaming model
# call (retry, replay, routing) — and rewrites the unicode dash family to
# ASCII hyphen-minus in text/reasoning deltas and in the assembled block-end
# blocks, exactly mirroring the user's ~/.hermes/agent-hooks/
# normalize-dashes.sh hook, but at the injection point hermes itself does not
# have: model output. Unlike the governance family (fs/observed, silent), the
# rewrite is deliberately VISIBLE — it flows into both the live UI and the
# durable transcript, because the normalization IS the feature.
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) — a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "…" not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the app
# is restarted (bundle layers compose at host boot). A file: dependency alone
# is NOT activation.
#
# `replacement` is the transform's only knob (volatile: hot-editable); the
# log/logFile cells are volatile for the same reason. `normalizeReasoning`
# defaults to ON (hermes normalizes whatever the model wrote, and the deltas
# AND the assembled block must agree); `normalizeToolArguments` is
# IMPLEMENTED (the argumentsDelta text and the assembled ToolCallBlock
# arguments are rewritten by the same transform when on, with two exemptions:
# an `edit` call or a `raw-write` call passes through by identity — the edit
# tool's old_string must match real file bytes, and the raw-write tool owns
# its content normalization through its explicit `normalize` parameter — and
# a call whose arguments open with the `{"__normalize":false` first-key
# marker passes through unnormalized with the marker entry stripped) with the
# SCHEMA
# default OFF — tool-call arguments are execution-critical raw JSON — and
# this example patch turns it ON (opt-in: the user accepts the risk).
- insert:
      - id: hook-dsh-normalize-dash
        name: "@playform/hook-dsh-normalize-dash"
        config:
            log: true
            logFile: ~/.dsh/hook-dsh-normalize-dash.log
            replacement: "-"
            normalizeReasoning: true
            normalizeToolArguments: true
