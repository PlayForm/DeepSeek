# Bundle patch for @playform/plugin-dsh-workspace-authority.
# The workspace-authority service IS the authority step of the workspace
# family's invisible flow: operate proposes -> the govern gates -> THE
# AUTHORITY LICENSES -> the approve binds. It keeps the three separate
# authority records (v4.1 section 3.9, correcting the corpus's own
# conflation): the capability (what the actor may do), the lease (for how
# long), and the residency (what stays in the store, with the weight in its
# own representation-only field). The eviction dispositions are keep, defer,
# evict, discard, promote - decided by the policy table; THE LICENSE DECIDES,
# THE WEIGHT ONLY RANKS (the license/weight conflation is a logged pitfall:
# Documentation/Plans/Workspace-Family/PITFALLS-LOG.md).
#
# New entries are declared with `insert:` - a bare `id:` row PATCHES an
# existing entry and the loader rejects unknown ids with 'entry "..." not
# found'. Activated when the profile's package.json lists the package in
# dsh.profile.bundles AND the app is restarted (bundle layers compose at host
# boot). A file: dependency alone is NOT activation.
#
# THE IDLE-FOREVER POSTURE: this entry ships with enabled: false and NOTHING
# else - the plugin never appears in the profile's bundles and enables only by
# an explicit ACTIVATE. On a cold mount the State build logs `disabled
# (enabled=false)`; the workspaceAuthority service still registers and reads
# honestly from the empty state, but grants, leases and evictions are refused
# with a byte-stable `refused ... (the authority is disabled)` line until
# enabled. The schema defaults are the truth; the full default surface (the
# default lease TTL, the per-holder ceilings, the revocation grace and the
# policy table) lives in the Variable/Config.ts schema. Every knob is a
# volatile cell (hot-editable without remounting); a policy edit lands on the
# next eviction pass.
- insert:
      - id: plugin-dsh-workspace-authority
        name: "@playform/plugin-dsh-workspace-authority"
        config:
            enabled: false
