# Bundle patch for @playform/plugin-dsh-batch-edit.
# The batch edit tool turns files into PROCESSES held in state: one tool
# (batch_edit) opens a machine, inserts files into it, and runs the
# transition table (replace / insert-after / insert-before / remove-line /
# append / prepend) across every held file in one go. Every write goes
# through Factory.Write and nothing else; the governed basenames run the
# factory's direct path exactly once per write (the govern actor marker,
# Gate.ts route 2 - re-route, never bypass). The atomic gate is
# all-or-nothing. Plan: Documentation/Plans/BATCH-EDIT-TOOL-FEATURE.md +
# Documentation/Plans/Batch-Edit-Tool/*.
#
# New entries are declared with `insert:` (docs/user/develop/basic/
# publish.md) - a bare `id:` row PATCHES an existing entry and the loader
# rejects unknown ids with 'entry "..." not found'. Activated when the
# profile's package.json lists the package in dsh.profile.bundles AND the
# app is restarted (bundle layers compose at host boot). A file: dependency
# alone is NOT activation.
#
# THE LIVE DISABLED POSTURE: every listener, the batch_edit tool and the root
# observer register on every mount - a disabled mount logs the byte-exact
# `disabled (enabled=false)` line instead of the activation proof, and every
# surface reads the volatile On cell at CALL time (each checks State.On first,
# so a flip lands on the very next call with no remount and a disabled surface
# passes through with zero ledger lines). The schema defaults
# are the truth; the full default surface (enabled true, log true, logFile
# ~/.dsh/playform/plugin-dsh-batch-edit.log, machinesPerAgent 2, opsPerCommit
# 64, deadlineMs 120000, strictMode false, interceptBash false,
# monitorChecksets []) lives in
# Variable/Config.ts. EVERY knob is volatile (hot-editable without
# remounting).
#
# THE POLICY BLOCK (D6, spelled out in full): the per-action allowlist is the
# OUTER gate in front of an apply - `write: approve` (the default) refuses the
# commit before any plan or write with the documented
# `apply refused <id> (policy write=approve)` line, the machine staying open
# with its cells observed; the user's approval is the existing approve binding
# (flip `policy.write` to auto). read/index/record/suggest and message are
# automatic; write/commit/spawn wait for approval. A resolved pack's `policy`
# section overrides these defaults per action (the wiring is the next
# refinement).
- insert:
      - id: plugin-dsh-batch-edit
        name: "@playform/plugin-dsh-batch-edit"
        config:
            enabled: true
            log: true
            logFile: ~/.dsh/playform/plugin-dsh-batch-edit.log
            policy:
                read: auto
                index: auto
                record: auto
                suggest: auto
                write: approve
                commit: approve
                spawn: approve
                message: auto
