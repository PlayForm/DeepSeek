<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
	aria-label="@playform/lib-dsh-core - crescent-ring">
	<title>@playform/lib-dsh-core - crescent-ring</title>
	<style>
		@media (prefers-reduced-motion: no-preference) {
			.lib-dsh-core-scene * {
				transform-box: view-box;
				transform-origin: 50% 50%;
			}

			.lib-dsh-core-counter {
				animation: lib-dsh-core-counter 22s linear -1s infinite;
			}

			@keyframes lib-dsh-core-counter {
				to {
					transform: rotate(-360deg);
				}
			}

			.lib-dsh-core-breathe {
				animation: lib-dsh-core-breathe 5s ease-in-out -1s infinite;
			}

			@keyframes lib-dsh-core-breathe {
				50% {
					transform: scale(1.06);
					opacity: 0.85;
				}
			}

			.lib-dsh-core-fire {
				animation: lib-dsh-core-fire 2.9s ease-in-out infinite;
			}

			@keyframes lib-dsh-core-fire {

				0%,
				100% {
					opacity: 0.35;
				}

				50% {
					opacity: 1;
				}
			}

			.lib-dsh-core-twinkle {
				animation: lib-dsh-core-twinkle 8s ease-in-out -1s infinite;
			}

			@keyframes lib-dsh-core-twinkle {

				0%,
				100% {
					transform: scale(0.94);
					opacity: 0.4;
				}

				50% {
					transform: scale(1.06);
					opacity: 1;
				}
			}
		}
	</style>
