	<title>@playform/ets-plugin-dsh-cost - interlace-tile</title>
	<style>
		@media (prefers-reduced-motion: no-preference) {
			.ets-plugin-dsh-cost-scene * {
				transform-box: view-box;
				transform-origin: 50% 50%;
			}

			.ets-plugin-dsh-cost-counter {
				animation: ets-plugin-dsh-cost-counter 21s linear -7s infinite;
			}

			@keyframes ets-plugin-dsh-cost-counter {
				to {
					transform: rotate(-360deg);
				}
			}

			.ets-plugin-dsh-cost-breathe {
				animation: ets-plugin-dsh-cost-breathe 7s ease-in-out -7s infinite;
			}

			@keyframes ets-plugin-dsh-cost-breathe {
				50% {
					transform: scale(1.06);
					opacity: 0.85;
				}
			}

			.ets-plugin-dsh-cost-fire {
				animation: ets-plugin-dsh-cost-fire 3.0s ease-in-out infinite;
			}

			@keyframes ets-plugin-dsh-cost-fire {

				0%,
				100% {
					opacity: 0.35;
				}

				50% {
					opacity: 1;
				}
			}

			.ets-plugin-dsh-cost-twinkle {
				animation: ets-plugin-dsh-cost-twinkle 9s ease-in-out -7s infinite;
			}

			@keyframes ets-plugin-dsh-cost-twinkle {

				0%,
				100% {
					transform: scale(0.94);
					opacity: 0.4;
				}

				50% {
					transform: scale(1.06);
					opacity: 1;
				}
			}

			.ets-plugin-dsh-cost-trace {
				animation: ets-plugin-dsh-cost-trace 4s ease-in-out -7s infinite;
			}

			@keyframes ets-plugin-dsh-cost-trace {

				0%,
				100% {
					transform: translate(0, 0);
					opacity: 1;
				}

				50% {
					transform: translate(1.4px, -1.4px);
					opacity: 0.35;
				}
			}
		}
	</style>
