				50% {
					transform: scale(1.06);
					opacity: 0.85;
				}
			}

			.hook-dsh-doc-suggester-fire {
				animation: hook-dsh-doc-suggester-fire 3.2s ease-in-out infinite;
			}

			@keyframes hook-dsh-doc-suggester-fire {

				0%,
				100% {
					opacity: 0.35;
				}

				50% {
					opacity: 1;
				}
			}

			.hook-dsh-doc-suggester-twinkle {
				animation: hook-dsh-doc-suggester-twinkle 12s ease-in-out -4s infinite;
			}

			@keyframes hook-dsh-doc-suggester-twinkle {

				0%,
				100% {
					transform: scale(0.94);
					opacity: 0.4;
				}

				50% {
					transform: scale(1.06);
					opacity: 1;
				}
			}
		}
	</style>
