		.plugin-dsh-pattern-twinkle { animation: plugin-dsh-pattern-twinkle 12s ease-in-out -5s infinite; }
		@keyframes plugin-dsh-pattern-twinkle { 0%, 100% { transform: scale(0.94); opacity: 0.4; } 50% { transform: scale(1.06); opacity: 1; } }
		}
