<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="@playform/plugin-dsh-feedback - interlace-tile">
	<title>@playform/plugin-dsh-feedback - interlace-tile</title>
	<style>
		@media (prefers-reduced-motion: no-preference) {
			.plugin-dsh-feedback-scene * { transform-box: view-box; transform-origin: 50% 50%; }
		.plugin-dsh-feedback-counter { animation: plugin-dsh-feedback-counter 21s linear -6s infinite; }
		@keyframes plugin-dsh-feedback-counter { to { transform: rotate(-360deg); } }
		.plugin-dsh-feedback-breathe { animation: plugin-dsh-feedback-breathe 5s ease-in-out -6s infinite; }
		@keyframes plugin-dsh-feedback-breathe { 50% { transform: scale(1.06); opacity: 0.85; } }
		.plugin-dsh-feedback-fire { animation: plugin-dsh-feedback-fire 2.8s ease-in-out infinite; }
		@keyframes plugin-dsh-feedback-fire { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
		.plugin-dsh-feedback-twinkle { animation: plugin-dsh-feedback-twinkle 11s ease-in-out -6s infinite; }
		@keyframes plugin-dsh-feedback-twinkle { 0%, 100% { transform: scale(0.94); opacity: 0.4; } 50% { transform: scale(1.06); opacity: 1; } }
		}
	</style>
