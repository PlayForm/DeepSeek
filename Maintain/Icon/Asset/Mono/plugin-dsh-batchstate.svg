		@keyframes plugin-dsh-batchstate-fire { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
		.plugin-dsh-batchstate-twinkle { animation: plugin-dsh-batchstate-twinkle 6s ease-in-out -4s infinite; }
		@keyframes plugin-dsh-batchstate-twinkle { 0%, 100% { transform: scale(0.94); opacity: 0.4; } 50% { transform: scale(1.06); opacity: 1; } }
		}
	</style>
