		@keyframes ets-plugin-dsh-pattern-twinkle { 0%, 100% { transform: scale(0.94); opacity: 0.4; } 50% { transform: scale(1.06); opacity: 1; } }
		.ets-plugin-dsh-pattern-trace { animation: ets-plugin-dsh-pattern-trace 5s ease-in-out -4s infinite; }
		@keyframes ets-plugin-dsh-pattern-trace { 0%, 100% { transform: translate(0, 0); opacity: 1; } 50% { transform: translate(1.4px, -1.4px); opacity: 0.35; } }
		}
	</style>
