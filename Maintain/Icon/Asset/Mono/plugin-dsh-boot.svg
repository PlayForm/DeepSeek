<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="@playform/plugin-dsh-boot - interlace-tile">
	<title>@playform/plugin-dsh-boot - interlace-tile</title>
	<style>
