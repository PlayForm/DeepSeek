		<path id="plugin-dsh-boot-4" d="M83,67 L84,69 L82,69 Z"/>
		<path id="plugin-dsh-boot-5" d="M53,50 L52,52 L51,52 L49,52 L48,52 L47,50 L48,48 L49,48 L51,48 L52,48 Z"/>
