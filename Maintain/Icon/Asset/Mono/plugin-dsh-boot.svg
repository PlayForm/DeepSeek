		@keyframes plugin-dsh-boot-breathe { 50% { transform: scale(1.06); opacity: 0.85; } }
		.plugin-dsh-boot-twinkle { animation: plugin-dsh-boot-twinkle 11s ease-in-out -1s infinite; }
		@keyframes plugin-dsh-boot-twinkle { 0%, 100% { transform: scale(0.94); opacity: 0.4; } 50% { transform: scale(1.06); opacity: 1; } }
		}
	</style>
