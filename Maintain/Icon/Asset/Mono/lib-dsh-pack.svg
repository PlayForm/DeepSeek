<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
	aria-label="@playform/lib-dsh-pack - crescent-ring">
	<title>@playform/lib-dsh-pack - crescent-ring</title>
	<style>
		@media (prefers-reduced-motion: no-preference) {
			.lib-dsh-pack-scene * {
				transform-box: view-box;
				transform-origin: 50% 50%;
			}

			.lib-dsh-pack-counter {
				animation: lib-dsh-pack-counter 23s linear -6s infinite;
			}

			@keyframes lib-dsh-pack-counter {
				to {
					transform: rotate(-360deg);
				}
			}

			.lib-dsh-pack-breathe {
				animation: lib-dsh-pack-breathe 7s ease-in-out -6s infinite;
			}

			@keyframes lib-dsh-pack-breathe {
				50% {
					transform: scale(1.06);
					opacity: 0.85;
				}
			}

			.lib-dsh-pack-fire {
				animation: lib-dsh-pack-fire 2.6s ease-in-out infinite;
			}

			@keyframes lib-dsh-pack-fire {

				0%,
				100% {
					opacity: 0.35;
				}

				50% {
					opacity: 1;
				}
			}

			.lib-dsh-pack-twinkle {
				animation: lib-dsh-pack-twinkle 9s ease-in-out -6s infinite;
			}

			@keyframes lib-dsh-pack-twinkle {

				0%,
				100% {
					transform: scale(0.94);
					opacity: 0.4;
				}

				50% {
					transform: scale(1.06);
					opacity: 1;
				}
			}
		}
	</style>
